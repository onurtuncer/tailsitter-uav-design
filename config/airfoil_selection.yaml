# Airfoil selection configuration for the tail-sitter.
#
# designation : NACA 4-digit airfoil to analyse.
#   Format: "NACA MPXX" or just the 4 digits e.g. "2412".
#
#   For a tail-sitter EDF the same wing operates in both regimes:
#     - Hovering: the wing is vertical, largely unstalled, contributing
#       mostly drag (covered by S_ratio in the VTOL power model).
#     - Cruising: the wing operates conventionally at low alpha.
#
#   Recommended candidates for a small research UAV (Re ~ 3e5..8e5):
#
#     NACA 0012  -- symmetric, t/c=0.12.  Zero pitching moment, simple to
#                   build and analyse.  Good for symmetric manoeuvre loads.
#                   Cl_max ~ 1.05. Baseline for tail-sitter comparisons.
#
#     NACA 2412  -- 2% camber at 40% chord, t/c=0.12.  Slight lift benefit
#                   over symmetric, small nose-down pitching moment.
#                   Cl_max ~ 1.40.  Most common general-aviation section.
#
#     NACA 4412  -- 4% camber at 40% chord, t/c=0.12.  Higher Cl_max ~1.65,
#                   better cruise L/D than 2412, larger pitching moment.
#                   Good if endurance is the priority.
#
#     NACA 2415  -- 2% camber, t/c=0.15.  Deeper spar, easier to build a
#                   stiff wing with standard carbon tube spars.
#                   Cl_max ~ 1.44, slightly more profile drag than 2412.
#
# f_body_m2    : fuselage + interference + misc equivalent flat-plate drag
#   area [m^2], held FIXED across wing sizes (ADR-0019, 2026-09-17
#   co-author wing study "NACA karsilastirma 3"): CD0_total =
#   Cd0_section + f_body/S. The earlier bookkeeping added a constant
#   CD0_fuselage = 0.010 referenced to whichever wing was evaluated, which
#   scaled the body drag with S. 0.001834 m^2 = that 0.010 referenced to
#   the study's reference wing A (the pre-ADR-0015 NACA 2412, 0.1834 m^2),
#   so the A wing's drag is unchanged by the switch.
#
# wing_comparison : candidate wings for the NB2 study comparison. The
#   converged design-point wing is always added by the notebook as the
#   baseline; the entries here are the alternatives, evaluated at their
#   own weight (Raymer wing-mass delta added on top of the design MTOW).
#   A = pre-ADR-0015 NACA 2412 wing (v0.5.0), C = the co-author's
#   proposed larger/higher-AR NACA 4412 wing.
#   V_ref_m_s : common comparison speed for the drag breakdown [m/s]
#               (18 m/s = the study's comparison speed, near every
#               candidate's V_MD).
#   dV_MD_m_s : operating-speed offset above V_MD at which the required
#               angle of attack is reported (the study's V_MD + 1) [m/s].
#
# n_coords     : number of coordinate points per surface for the .dat file.

# Selected 2026-07-18 (ADR-0015): NACA 4412. After the v0.5.0 CL_max
# consistency fix the stall-limited wing sizing rewards section lift
# directly: the 4412's CL_max_3D 1.489 shrinks the wing back to
# ~0.172 m^2 / b ~1.016 m (smaller than the pre-fix 2412 wing), puts
# cruise CL 0.535 near the polar optimum (L/D 13.35, V_MD ~18.5 m/s vs
# the 20 m/s cruise), and the mission is cruise-dominated -- exactly the
# "endurance priority" case above. Watch items: larger nose-down Cm
# (trim, not modelled at this stage) and the empirical Cl_max at
# Re ~ 1.4e5 near stall (low-Re erosion -- validate before freezing
# the wing tooling).
designation: NACA 4412
f_body_m2: 0.001834
wing_comparison:
  V_ref_m_s: 18.0
  dV_MD_m_s: 1.0
  candidates:
    - {label: "A -- pre-ADR-0015 2412", designation: NACA 2412, S_m2: 0.1834, AR: 6.0}
    - {label: "C -- co-author 4412",    designation: NACA 4412, S_m2: 0.2100, AR: 6.5}
n_coords: 200